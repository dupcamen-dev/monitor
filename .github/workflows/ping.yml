name: Ping monitors

# Primary scheduler for the ping cron.
# Vercel Cron only runs once per day on the Hobby plan, so this free
# GitHub Action runs every 5 minutes instead.
#
# Required repo configuration:
#   - Secret:  CRON_SECRET  (same value as Vercel env var CRON_SECRET)
#   - Variable: VERCEL_URL   e.g. your-app.vercel.app (no protocol)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ping cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_URL: ${{ vars.VERCEL_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$VERCEL_URL" ]; then
            echo "::error::Set repo secret CRON_SECRET and variable VERCEL_URL (e.g. your-app.vercel.app)"
            exit 1
          fi
          curl -fsS --fail-with-body -X POST "https://$VERCEL_URL/api/cron/ping" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
